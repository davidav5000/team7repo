<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Activity · Campus Activities</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="/">Campus Activities</a>
        <nav class="nav" aria-label="Main">
          <a href="/">Feed</a>
          <a href="/activity-new.html" aria-current="page">Create</a>
          <a href="/profile.html">Profile</a>
          <form method="post" action="/logout">
            <button class="btn-link" type="submit">Log out</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="medium">
      <div class="card">
        <h1>Create an activity</h1>

        <div class="alert" id="activity-error" role="alert"></div>

        <!-- POST /activities (requires login)
             body: { title, startsAt, location, description, latitude?, longitude? } -->
        <form id="activity-form" method="post" action="/activities">
          <div class="form-field">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" maxlength="120" required />
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="startsAt">Date &amp; time</label>
              <input id="startsAt" name="startsAt" type="datetime-local" required />
            </div>
            <div class="form-field">
              <label for="location">Location</label>
              <input
                id="location"
                name="location"
                type="text"
                maxlength="200"
                placeholder="e.g. Library, Room 204"
                required
              />
            </div>
          </div>

          <div class="form-field">
            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>
          </div>

          <fieldset>
            <legend>Map coordinates (optional)</legend>
            <div class="form-row">
              <div class="form-field">
                <label for="latitude">Latitude</label>
                <input
                  id="latitude"
                  name="latitude"
                  type="number"
                  step="any"
                  min="-90"
                  max="90"
                />
              </div>
              <div class="form-field">
                <label for="longitude">Longitude</label>
                <input
                  id="longitude"
                  name="longitude"
                  type="number"
                  step="any"
                  min="-180"
                  max="180"
                />
              </div>
            </div>
            <p class="hint">Fill both or neither. Used for the map in Phase 2.</p>
          </fieldset>

          <div class="form-actions">
            <button class="btn" type="submit">Post activity</button>
            <a class="btn btn-secondary" href="/">Cancel</a>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer">Campus Activities · Team 7</footer>
  </body>
</html>
