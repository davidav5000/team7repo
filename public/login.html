<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · Campus Activities</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/login.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="index.html">Campus Activities</a>
        <nav class="nav" aria-label="Main">
          <a href="index.html">Feed</a>
          <a href="login.html" aria-current="page">Log in</a>
          <a href="register.html">Register</a>
        </nav>
      </div>
    </header>

    <main class="narrow">
      <div class="card">
        <h1>Log in</h1>
        <p class="muted small">Sign in to create activities, RSVP, and join discussions.</p>

        <div class="alert" id="login-error" role="alert" aria-live="polite"></div>

        <form id="login-form" method="post" action="/login">
          <div class="form-field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              minlength="3"
              maxlength="30"
              pattern="[A-Za-z0-9_]+"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button class="btn btn-block" id="login-submit" type="submit">Log in</button>
        </form>

        <p class="small muted">
          New here? <a href="register.html">Create an account</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">Campus Activities · Team 7</footer>
  </body>
</html>
