<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity Feed · Campus Activities</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/nav.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/feed.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="index.html">Campus Activities</a>
        <nav class="nav" aria-label="Main">
          <a href="index.html" aria-current="page">Feed</a>
          <a href="activity-new.html">Create</a>
          <a href="profile.html">Profile</a>
          <a href="login.html">Log in</a>
          <a href="register.html">Register</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="page-head">
        <div>
          <h1>Find your next campus adventure</h1>
          <p class="muted">Meet people, discover events, and get involved.</p>
        </div>
        <a class="btn" href="activity-new.html">+ New activity</a>
      </div>

      <form class="toolbar" id="search-form" role="search">
        <input
          type="search"
          name="q"
          placeholder="Search activities"
          aria-label="Search activities"
        />
        <button class="btn btn-secondary" type="submit">Search</button>
        <button class="btn btn-secondary" id="clear-search" type="button">
          Clear
        </button>
      </form>

      <div class="alert" id="feed-error" role="alert"></div>

      <p class="muted small">Search the campus activity feed.</p>
      <!-- Activity cards are rendered by js/feed.js. -->
      <div class="feed" id="activity-feed"></div>

      <!-- Show when the feed is empty. -->
      <div class="card empty-state" id="feed-empty" hidden>
        <p>No activities yet.</p>
        <a class="btn" href="activity-new.html">Create the first one</a>
      </div>
    </main>

    <footer class="site-footer">Campus Activities · Team 7</footer>
  </body>
</html>
