<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile · Campus Activities</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="/">Campus Activities</a>
        <nav class="nav" aria-label="Main">
          <a href="/">Feed</a>
          <a href="/activity-new.html">Create</a>
          <a href="/profile.html" aria-current="page">Profile</a>
          <form method="post" action="/logout">
            <button class="btn-link" type="submit">Log out</button>
          </form>
        </nav>
      </div>
    </header>

    <!-- GET /users/me (requires login) → { user: { id, name, username, ... } } -->
    <main class="medium">
      <div class="alert" id="profile-error" role="alert"></div>

      <section class="card">
        <div class="profile-head">
          <div class="avatar" id="profile-initial" aria-hidden="true">J</div>
          <div>
            <h1 id="profile-name">Jordan Doe</h1>
            <p class="muted" id="profile-username">@jdoe</p>
          </div>
        </div>
      </section>

      <!-- Phase 2: "My Activities". Placeholder lists for now. -->
      <section class="card" aria-labelledby="hosting-heading">
        <h2 id="hosting-heading">Hosting</h2>
        <ul class="attendee-list" id="hosting-list">
          <li><a href="/activity.html?id=1">Pickup Soccer on the Quad</a> · Oct 10</li>
        </ul>
      </section>

      <section class="card" aria-labelledby="going-heading">
        <h2 id="going-heading">Going to</h2>
        <ul class="attendee-list" id="going-list">
          <li><a href="/activity.html?id=3">Board Game Night</a> · Oct 15</li>
        </ul>
        <p class="hint">Full "My Activities" view comes in Phase 2.</p>
      </section>

      <form method="post" action="/logout">
        <button class="btn btn-secondary" type="submit">Log out</button>
      </form>
    </main>

    <footer class="site-footer">Campus Activities · Team 7</footer>
  </body>
</html>
