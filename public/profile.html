<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile · Campus Activities</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/profile.js" defer></script>
    <script src="js/logout.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="index.html">Campus Activities</a>
        <nav class="nav" aria-label="Main">
          <a href="index.html">Feed</a>
          <a href="activity-new.html">Create</a>
          <a href="profile.html" aria-current="page">Profile</a>
          <form method="post" action="/logout">
            <button class="btn-link" type="submit">Log out</button>
          </form>
        </nav>
      </div>
    </header>

    <!-- GET /users/me (requires login) → { user: { id, name, username, ... } } -->
    <main class="medium">
      <div class="alert" id="profile-error" role="alert" aria-live="polite"></div>

      <section class="card">
        <div class="profile-head">
          <div class="avatar" id="profile-initial" aria-hidden="true">…</div>
          <div>
            <h1 id="profile-name">Loading profile…</h1>
            <p class="muted" id="profile-username"></p>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="hosting-heading">
        <h2 id="hosting-heading">Hosting</h2>
        <ul class="attendee-list" id="hosting-list"></ul>
        <p class="hint" id="hosting-empty" hidden>You are not hosting any activities yet.</p>
      </section>

      <section class="card" aria-labelledby="going-heading">
        <h2 id="going-heading">Going to</h2>
        <ul class="attendee-list" id="going-list"></ul>
        <p class="hint" id="going-empty" hidden>You are not attending any activities yet.</p>
      </section>

      <form method="post" action="/logout">
        <button class="btn btn-secondary" type="submit">Log out</button>
      </form>
    </main>

    <footer class="site-footer">Campus Activities · Team 7</footer>
  </body>
</html>
