<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity · Campus Activities</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/nav.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/logout.js" defer></script>
    <script src="js/activity-detail.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="index.html">Campus Activities</a>
        <nav class="nav" aria-label="Main">
          <a href="index.html">Feed</a>
          <a href="activity-new.html">Create</a>
          <a href="profile.html">Profile</a>
          <form method="post" action="/logout">
            <button class="btn-link" type="submit">Log out</button>
          </form>
        </nav>
      </div>
    </header>

    <!-- URL: /activity.html?id=123  → GET /activities/123 -->
    <main>
      <p class="small"><a href="index.html">← Back to feed</a></p>

      <div class="alert" id="activity-error" role="alert"></div>

      <div class="detail-grid">
        <!-- Left column: activity + discussion -->
        <div>
          <article class="card" id="activity-detail">
            <h1 id="activity-title">Loading activity…</h1>

            <dl class="detail-meta">
              <dt>When</dt>
              <dd id="activity-when">—</dd>
              <dt>Where</dt>
              <dd id="activity-location">—</dd>
              <dt>Host</dt>
              <dd id="activity-host">—</dd>
            </dl>

            <p id="activity-description"></p>

            <!-- Show only when the logged-in user is the creator. -->
            <div class="owner-actions" id="owner-actions" hidden>
              <a class="btn btn-secondary" href="#">Edit</a>
              <!-- DELETE /activities/:id -->
              <button class="btn btn-danger" type="button" id="delete-activity">
                Delete
              </button>
            </div>
          </article>

          <section class="card" aria-labelledby="discussion-heading">
            <h2 id="discussion-heading">Discussion</h2>

            <!-- GET /activities/:id/comments fills this list. -->
            <ul class="comments" id="comment-list"></ul>

            <div class="alert" id="comment-error" role="alert"></div>

            <!-- POST /activities/:id/comments  body: { message } -->
            <form id="comment-form">
              <div class="form-field">
                <label for="message">Add a comment</label>
                <textarea
                  id="message"
                  name="message"
                  maxlength="2000"
                  required
                ></textarea>
              </div>
              <button class="btn" type="submit">Post comment</button>
            </form>
          </section>
        </div>

        <!-- Right column: attendance + map -->
        <aside>
          <section class="card" aria-labelledby="attendance-heading">
            <h2 id="attendance-heading">Who's going</h2>
            <p><span class="badge" id="attendee-count">0 going</span></p>

            <!-- POST /activities/:id/attendance to join; DELETE to withdraw.
                 Toggle label to "Can't make it" when the user is already going. -->
            <button class="btn btn-block" type="button" id="attend-toggle">
              I'm Going
            </button>

            <ul class="attendee-list" id="attendee-list"></ul>
          </section>

          <section class="card" aria-labelledby="map-heading">
            <h2 id="map-heading">Map</h2>
            <div class="map-placeholder" id="activity-map">No map location provided.</div>
          </section>
        </aside>
      </div>
    </main>

    <footer class="site-footer">Campus Activities · Team 7</footer>
  </body>
</html>
